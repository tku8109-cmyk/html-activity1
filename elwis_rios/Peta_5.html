<!DOCTYPE html>
<html>
<head>
  <title>Rectangle Layout</title>
</head>
<body bgcolor="#ffffff">
  <center>
    <table cellspacing="30" cellpadding="0" border="0">
      
      
      <tr>
        
        <td valign="top">
          <table border="2" cellpadding="0" cellspacing="0" width="150" height="150">
            <tr>
              <td colspan="2" bgcolor="red" width="100" height="40"></td>
              <td rowspan="3" bgcolor="blue" width="50"></td>
            </tr>
            <tr>
              <td rowspan="2" bgcolor="green" width="40"></td>
              <td bgcolor="gray"></td>
            </tr>
            <tr>
              <td colspan="2" bgcolor="yellow"></td>
            </tr>
          </table>
        </td>

      
        <td valign="top">
          <table border="2" cellspacing="2" cellpadding="0" width="200" height="150">
            <tr>
              <td bgcolor="red" width="40" height="40"></td>
              <td bgcolor="yellow" width="40" height="40"></td>
              <td bgcolor="cyan" rowspan="2" width="60" height="80"></td>
            </tr>
            <tr>
              <td colspan="2" bgcolor="blue" height="40"></td>
            </tr>
            <tr>
              <td colspan="3" bgcolor="magenta" height="40"></td>
            </tr>
          </table>
        </td>
      </tr>

      
      <tr>
        
        <td valign="top">
          <table border="2" cellspacing="2" cellpadding="0" width="200" height="150">
            <tr>
              <td rowspan="3" bgcolor="cyan" width="60" height="120"></td>
              <td bgcolor="blue" width="40" height="40"></td>
              <td bgcolor="magenta" width="40" height="40"></td>
            </tr>
            <tr>
              <td colspan="2" bgcolor="lime" height="40"></td>
            </tr>
            <tr>
              <td bgcolor="gray" height="40"></td>
              <td bgcolor="yellow" height="40"></td>
            </tr>
          </table>

          
          <br>
          <table bgcolor="#2B4A6F" style="border:5px solid #3A5E8C;" cellpadding="10" cellspacing="0">
            <tr>
              <td>
                <table bgcolor="#EEECDD" style="border:5px solid #3A5E8C;" cellpadding="10" cellspacing="0">
                  <tr>
                    <td>
                      <table bgcolor="#B44E46" style="border:5px solid #3A5E8C;" cellpadding="10" cellspacing="0">
                        <tr>
                          <td>
                            <table bgcolor="#FFF200" style="border:5px solid #3A5E8C;" cellpadding="10" cellspacing="0">
                              <tr>
                                <td>
                                  <table bgcolor="#00C15B" style="border:5px solid #3A5E8C;" cellpadding="20" cellspacing="0">
                                    <tr>
                                      <td width="120" height="60"></td>
                                    </tr>
                                  </table>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>

        
        <td valign="top">
          <table border="5" cellspacing="0" height="150" width="250"
          style="border-collapse:separate; border:4px solid black; border-radius:15px; overflow:hidden;">
            <tr>
              <td bgcolor="white" style="border:3px solid black;"></td>
              <td bgcolor="red" style="border:3px solid black;"></td>
            </tr>
            <tr>
              <td bgcolor="yellow" style="border:3px solid black;"></td>
              <td bgcolor="white" style="border:3px solid black;"></td>
            </tr>
            <tr>
              <td bgcolor="white" style="border:3px solid black;"></td>
              <td bgcolor="#7B61FF" style="border:3px solid black;"></td>
            </tr>
          </table>
        </td>
      </tr>

    </table>
  </center>
</body>
</html>
